name: Build Raspberry Pi image

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
      publish_draft_release:
        description: Publish the bundle as a draft GitHub release
        required: true
        default: false
        type: boolean
      build_update_candidate:
        description: Also package an unsigned installed-device update candidate
        required: true
        default: false
        type: boolean
      update_source_minimum:
        description: Minimum installed version accepted by the update candidate
        required: false
        default: ""
        type: string
      update_source_maximum_exclusive:
        description: Exclusive upper installed-version bound
        required: false
        default: "0.2.0"
        type: string
      update_key_id:
        description: Public key identifier expected when the candidate is signed offline
        required: false
        default: preview-local
        type: string
      build_base_os_candidate:
        description: Also build the A/B image and package an unsigned base-OS update candidate (RFC-0016)
        required: true
        default: false
        type: boolean
      base_os_source_minimum:
        description: Minimum installed base-OS version accepted by the update candidate
        required: false
        default: ""
        type: string
      base_os_source_maximum_exclusive:
        description: Exclusive upper installed base-OS version bound
        required: false
        default: "0.2.0"
        type: string
      base_os_key_id:
        description: Public key identifier expected when the base-OS candidate is signed offline
        required: false
        default: preview-local
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check host capacity
        run: |
          uname -a
          test "$(uname -m)" = aarch64
          docker version
          df -h .

      - name: Build image
        env:
          SOVEREIGN_VERSION: ${{ inputs.version }}
          SOVEREIGN_CHANNEL: ${{ inputs.channel }}
        run: ./scripts/build-sovereign-image.sh

      - name: Package release candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          ./scripts/create-release-bundle.py \
            --deploy-dir build/sovereign-image/deploy \
            --output-dir build/release \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --source-revision "$GITHUB_SHA" \
            --source-date-epoch "$source_date_epoch"
          cd build/release
          sha256sum --check SHA256SUMS

      - name: Package unsigned appliance update candidate
        if: inputs.build_update_candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          UPDATE_SOURCE_MINIMUM: ${{ inputs.update_source_minimum }}
          UPDATE_SOURCE_MAXIMUM_EXCLUSIVE: ${{ inputs.update_source_maximum_exclusive }}
          UPDATE_KEY_ID: ${{ inputs.update_key_id }}
        run: |
          test -n "$UPDATE_SOURCE_MINIMUM"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          ./scripts/create-update-release.py \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --source-minimum "$UPDATE_SOURCE_MINIMUM" \
            --source-maximum-exclusive "$UPDATE_SOURCE_MAXIMUM_EXCLUSIVE" \
            --pihole-env image-builder/sovereign/pihole-image.env \
            --oci build/sovereign-image/evidence/oci/pihole-arm64.oci.tar \
            --llama-env image-builder/sovereign/llama-image.env \
            --llama-oci build/sovereign-image/evidence/oci/llama-arm64.oci.tar \
            --output-dir build/update-release \
            --key-id "$UPDATE_KEY_ID" \
            --artifact-base-url "https://github.com/sovereignfs/sovereign-os/releases/download/v${RELEASE_VERSION}" \
            --notes-url "https://github.com/sovereignfs/sovereign-os/releases/tag/v${RELEASE_VERSION}" \
            --source-date-epoch "$source_date_epoch"

      # A base-OS candidate needs boot/root images built under the A/B
      # tryboot layout (RFC-0016), which the primary build above never
      # produces -- it targets the plain, non-A/B image. This is a real
      # second full image build (roughly doubling this job's runtime),
      # so it only runs when explicitly requested rather than on every
      # invocation.
      - name: Build base-OS image
        if: inputs.build_base_os_candidate
        env:
          SOVEREIGN_VERSION: ${{ inputs.version }}
          SOVEREIGN_CHANNEL: ${{ inputs.channel }}
          SOVEREIGN_IMAGE_CONFIG: sovereign-ab-proof.yaml
        run: ./scripts/build-sovereign-image.sh

      - name: Package unsigned base-OS update candidate
        if: inputs.build_base_os_candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          BASE_OS_SOURCE_MINIMUM: ${{ inputs.base_os_source_minimum }}
          BASE_OS_SOURCE_MAXIMUM_EXCLUSIVE: ${{ inputs.base_os_source_maximum_exclusive }}
          BASE_OS_KEY_ID: ${{ inputs.base_os_key_id }}
        run: |
          test -n "$BASE_OS_SOURCE_MINIMUM"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          ./scripts/create-base-os-release.py \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --source-minimum "$BASE_OS_SOURCE_MINIMUM" \
            --source-maximum-exclusive "$BASE_OS_SOURCE_MAXIMUM_EXCLUSIVE" \
            --boot build/sovereign-image-sovereign-ab-proof/evidence/base-os/boot.vfat \
            --root build/sovereign-image-sovereign-ab-proof/evidence/base-os/root.ext4 \
            --output-dir build/base-os-release \
            --key-id "$BASE_OS_KEY_ID" \
            --artifact-base-url "https://github.com/sovereignfs/sovereign-os/releases/download/v${RELEASE_VERSION}" \
            --notes-url "https://github.com/sovereignfs/sovereign-os/releases/tag/v${RELEASE_VERSION}" \
            --source-date-epoch "$source_date_epoch"

      - name: Upload image release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sovereign-os-${{ inputs.version }}-rpi5-arm64
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # The flashable A/B disk image itself (as opposed to the boot/root
      # partition images create-base-os-release.py extracts above) has no
      # release-bundle packaging of its own -- create-release-bundle.py
      # hardcodes plain-image assumptions (a fixed evidence path, a fixed
      # "sovereign-proof.img.zst" filename) that don't hold for the A/B
      # config's differently-named output. Uploaded raw and unpackaged
      # here rather than extending that script for a need this milestone
      # doesn't otherwise have: reflashing a device onto the A/B layout,
      # or recovering one already on it, needs the disk image itself, not
      # SHA256SUMS/SBOM/provenance ceremony designed around a public
      # release.
      - name: Upload flashable A/B image artifact
        if: inputs.build_base_os_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sovereign-os-ab-${{ inputs.version }}-rpi5-arm64
          path: build/sovereign-image-sovereign-ab-proof/deploy/*.img.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload installed-device update artifact
        if: inputs.build_update_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sovereign-update-${{ inputs.version }}-rpi5-arm64
          path: build/update-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload base-OS update artifact
        if: inputs.build_base_os_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sovereign-base-os-${{ inputs.version }}-rpi5-arm64
          path: build/base-os-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish draft release
        if: inputs.publish_draft_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          BUILD_UPDATE_CANDIDATE: ${{ inputs.build_update_candidate }}
          BUILD_BASE_OS_CANDIDATE: ${{ inputs.build_base_os_candidate }}
        run: |
          assets=(build/release/*)
          if [ "$BUILD_UPDATE_CANDIDATE" = "true" ]; then
            # The update candidate's release-manifest.json is unsigned here —
            # CI never holds the signing key. sovereign-update check only
            # treats a release as a candidate once both release-manifest.json
            # and release-manifest.sig are present, so this alone does not
            # make the release discoverable; an operator still has to sign
            # the manifest offline and upload the resulting .sig before
            # publishing.
            assets+=(build/update-release/*)
          fi
          if [ "$BUILD_BASE_OS_CANDIDATE" = "true" ]; then
            # Same offline-signing gap as the appliance candidate above,
            # via base-os-manifest.json/.sig instead (ADR-0006).
            assets+=(build/base-os-release/*)
          fi
          gh release create "v${RELEASE_VERSION}" "${assets[@]}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Sovereign OS ${RELEASE_VERSION} (${RELEASE_CHANNEL})" \
            --notes "Engineering image candidate. Raspberry Pi 5 hardware qualification and the Phase 01 release checklist remain required before publication."
