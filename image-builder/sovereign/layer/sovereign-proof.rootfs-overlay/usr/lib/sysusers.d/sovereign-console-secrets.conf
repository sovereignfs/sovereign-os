#Type Name                       ID GECOS Home directory Shell
# Deliberately not named "sovereign-console" -- systemd's DynamicUser
# derives a same-named dynamic group from a unit's own name, and
# sovereign-console.service (console-health) already claims that exact
# identity. Found on real hardware: restarting that service failed
# ("User or group with specified name already exists") once a static
# group of the same name existed.
g     sovereign-console-secrets -
